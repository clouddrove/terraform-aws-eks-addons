apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana
  namespace: monitoring
spec:
  hosts:
    - grafana.test.clouddrove.com
  gateways:
  - istio-system/istio-gateway
  http:
  - route:
    - destination:
        host: kube-prometheus-stack-grafana
        port:
          number: 80
